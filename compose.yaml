services:
  postgres:
    image: postgres:17-alpine
    container_name: your-shadow-postgres
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
