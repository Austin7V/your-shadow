name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: your_shadow
          POSTGRES_USER: your_shadow
          POSTGRES_PASSWORD: your_shadow_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U your_shadow -d your_shadow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://your_shadow:your_shadow_local_password@localhost:5432/your_shadow
      JWT_ACCESS_SECRET: ci-test-access-secret-with-at-least-32-characters
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared contracts
        run: bun run contracts:build

      - name: Type-check shared contracts
        run: bun run contracts:typecheck

      - name: Run database migrations
        run: bun run db:migration:run

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Run unit tests
        run: bun run test

      - name: Run end-to-end tests
        run: bun run test:e2e
